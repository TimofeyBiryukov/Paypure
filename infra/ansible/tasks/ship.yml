# Streams straight into `docker load` over SSH: no tarball on the server's disk.
- name: Stream missing images to the server
  ansible.builtin.shell: >-
    set -o pipefail &&
    docker save paypure-{{ item }}:{{ image_tags[item] }} | gzip -1
    | ssh -o BatchMode=yes {{ ansible_user }}@{{ ansible_host }} docker load
  args: { executable: /bin/bash }
  loop: "{{ missing_images }}"
  delegate_to: localhost
  changed_when: true
