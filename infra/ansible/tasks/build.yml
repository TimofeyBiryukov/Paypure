- name: Are this version's images already on the server
  ansible.builtin.command: >-
    docker image inspect paypure-api:{{ paypure_version }} paypure-client:{{ paypure_version }}
  register: have_images
  changed_when: false
  failed_when: false

- name: Build arm64 images locally
  when: have_images.rc != 0
  delegate_to: localhost
  run_once: true
  block:
    - name: Build {{ item }}
      ansible.builtin.command: >-
        docker buildx build --platform linux/arm64 --target prod
        -f {{ item }}/Dockerfile -t paypure-{{ item }}:{{ paypure_version }} --load .
      args: { chdir: "{{ repo_root }}" }
      loop: [api, client]
      changed_when: true

    - name: Build directory exists
      ansible.builtin.file: { path: "{{ build_dir }}", state: directory, mode: "0700" }

    - name: Save both images to one tarball
      ansible.builtin.shell: >-
        set -o pipefail &&
        docker save paypure-api:{{ paypure_version }} paypure-client:{{ paypure_version }}
        | gzip -1 > {{ build_dir }}/paypure-{{ paypure_version }}.tar.gz
      args: { executable: /bin/bash }
      changed_when: true
