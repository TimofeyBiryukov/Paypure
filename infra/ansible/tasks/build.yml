- name: Which images the server already has
  ansible.builtin.command: docker image inspect paypure-{{ item.key }}:{{ item.value }}
  loop: "{{ image_tags | dict2items }}"
  register: have_images
  changed_when: false
  failed_when: false

- name: Images to build and ship
  ansible.builtin.set_fact:
    missing_images: >-
      {{ have_images.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item.key') | list }}

- name: Build missing arm64 images locally
  ansible.builtin.command: >-
    docker buildx build --platform linux/arm64 --target prod
    -f {{ item }}/Dockerfile -t paypure-{{ item }}:{{ image_tags[item] }} --load .
  args: { chdir: "{{ repo_root }}" }
  loop: "{{ missing_images }}"
  delegate_to: localhost
  run_once: true
  changed_when: true
