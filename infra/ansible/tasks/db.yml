- name: Reset the database (destroys all Paypure data)
  when: paypure_reset_db | default('') == 'yes-destroy-data'
  block:
    - name: Stop the stack
      ansible.builtin.command: "{{ compose }} down"
      changed_when: true
    - name: Remove the data volume
      ansible.builtin.command: docker volume rm {{ compose_project }}_pgdata
      register: rmvol
      changed_when: rmvol.rc == 0
      failed_when: rmvol.rc != 0 and 'no such volume' not in rmvol.stderr | lower

- name: Start postgres
  ansible.builtin.command: "{{ compose }} up -d --wait postgres"
  register: pg_up
  changed_when: "'Started' in pg_up.stderr or 'Created' in pg_up.stderr"

- name: App role and grants
  ansible.builtin.command:
    cmd: "{{ compose }} exec -T postgres psql -U paypure -d paypure -q -f -"
    stdin: "{{ lookup('template', 'bootstrap-roles.sql.j2') }}"
  changed_when: false
  no_log: true

- name: Is the database empty
  ansible.builtin.command: >-
    {{ compose }} exec -T postgres psql -U paypure -d paypure -Atc
    "select to_regclass('public._prisma_migrations') is null"
  register: db_empty
  changed_when: false

- name: Restore the seed snapshot
  when: db_empty.stdout == 't'
  block:
    - name: Seed dump exists locally
      ansible.builtin.stat: { path: "{{ seed_dump }}" }
      delegate_to: localhost
      register: seed
      failed_when: not seed.stat.exists
      run_once: true

    - name: Copy seed dump
      ansible.builtin.copy:
        src: "{{ seed_dump }}"
        dest: "{{ paypure_dir }}/seed.dump"
        mode: "0600"

    - name: Restore seed dump
      ansible.builtin.shell: >-
        {{ compose }} exec -T postgres pg_restore -U paypure -d paypure
        --no-owner --role=paypure --exit-on-error < {{ paypure_dir }}/seed.dump
      changed_when: true

    - name: Grants on the restored tables
      ansible.builtin.command:
        cmd: "{{ compose }} exec -T postgres psql -U paypure -d paypure -q -f -"
        stdin: "{{ lookup('template', 'bootstrap-roles.sql.j2') }}"
      changed_when: true
      no_log: true

  always:
    - name: Remove seed dump from the server
      ansible.builtin.file: { path: "{{ paypure_dir }}/seed.dump", state: absent }

- name: Apply migrations
  ansible.builtin.command: "{{ compose }} run --rm api-migrate"
  register: migrate
  changed_when: "'No pending migrations' not in migrate.stdout"
