# Dev: `docker compose up` starts the whole system (Tech §7.1). No .env needed (R2).
# Agent worktrees get a generated .env (scripts/agent/setup.sh) that sets
# COMPOSE_PROJECT_NAME and every host port below, so stacks never collide.
x-node-dev: &node-dev
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-node-volumes: &node-volumes
  - .:/app
  - node_modules:/app/node_modules
  - api_node_modules:/app/api/node_modules
  - client_node_modules:/app/client/node_modules
  - domain_node_modules:/app/packages/domain/node_modules

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paypure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paypure}
      POSTGRES_DB: ${POSTGRES_DB:-paypure}
      TZ: UTC
    command: >
      postgres -c shared_buffers=128MB -c work_mem=4MB
               -c max_connections=40 -c effective_cache_size=384MB
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./api/prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paypure}"]
      interval: 3s
      retries: 20
    deploy: { resources: { limits: { memory: 512m } } }

  # One-shot: the only service that runs pnpm install (Tech §7.1). Also builds @paypure/domain
  # and generates the Prisma client, so api and client start from a ready tree.
  deps:
    build: { context: ., dockerfile: api/Dockerfile, target: dev }
    command: >
      sh -c "pnpm install --frozen-lockfile &&
             pnpm --filter @paypure/domain build &&
             pnpm --filter api exec prisma generate"
    environment:
      DATABASE_URL: postgresql://paypure:paypure@postgres:5432/paypure
      npm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/api/node_modules
      - client_node_modules:/app/client/node_modules
      - domain_node_modules:/app/packages/domain/node_modules
      - pnpm_store:/pnpm/store

  api:
    <<: *node-dev
    build: { context: ., dockerfile: api/Dockerfile, target: dev }
    command: >
      sh -c "pnpm --filter api exec prisma migrate deploy &&
             pnpm --filter api start:dev"
    environment:
      TZ: UTC
      NODE_ENV: development
      PORT: 4000
      # The app connects as a role that doesn't own the tables, so it can't disable the
      # immutability triggers (08 §3.3). Migrations run as the owner.
      DATABASE_URL: postgresql://paypure:paypure@postgres:5432/paypure
      APP_DATABASE_URL: postgresql://paypure_app:paypure_app@postgres:5432/paypure
      CLIENT_INTERNAL_URL: http://client:3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      GOTENBERG_URL: http://gotenberg:3000
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      SMTP_URL: smtp://mailpit:1025
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret}
      PRINT_SIGNING_SECRET: ${PRINT_SIGNING_SECRET:-dev-only-print-secret}
      NODE_OPTIONS: --max-old-space-size=384
    ports: ["${API_PORT:-4000}:4000", "${API_DEBUG_PORT:-9229}:9229"]
    volumes: *node-volumes
    depends_on:
      deps: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 768m } } }

  client:
    <<: *node-dev
    build: { context: ., dockerfile: client/Dockerfile, target: dev }
    command: pnpm --filter client dev
    environment:
      TZ: UTC
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      API_URL: http://api:4000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PRINT_SIGNING_SECRET: ${PRINT_SIGNING_SECRET:-dev-only-print-secret}
    ports: ["${CLIENT_PORT:-3000}:3000", "${CLIENT_DEBUG_PORT:-9230}:9229"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/api/node_modules
      - client_node_modules:/app/client/node_modules
      - domain_node_modules:/app/packages/domain/node_modules
      - client_next:/app/client/.next
    depends_on:
      deps: { condition: service_completed_successfully }
      api: { condition: service_started }
    deploy: { resources: { limits: { memory: 1g } } }

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--chromium-restart-after=50", "--api-timeout=30s"]
    deploy: { resources: { limits: { memory: 512m } } }

  mailpit:
    image: axllent/mailpit
    ports: ["${MAILPIT_PORT:-8025}:8025"]
    profiles: [mail]

  adminer:
    image: michalhosna/adminer
    ports: ["${ADMINER_PORT:-8081}:8080"]
    environment:
      ADMINER_DRIVER: pgsql
      ADMINER_SERVER: postgres
      ADMINER_DB: paypure
      ADMINER_USERNAME: paypure
      ADMINER_PASSWORD: paypure
      ADMINER_AUTOLOGIN: 1
      ADMINER_NAME: Paypure DB
    profiles: [tools]

volumes:
  pgdata: {}
  node_modules: {}
  api_node_modules: {}
  client_node_modules: {}
  domain_node_modules: {}
  client_next: {}
  # Shared by every stack (primary + agent worktrees) so installs stay fast.
  pnpm_store: { name: paypure_pnpm_store }
